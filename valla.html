<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comfamiliar Nariño | Valla en Realidad Aumentada</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f5; text-align: center; }
    header { background: #039047; color: #fff; padding: 14px; font-weight: bold; font-size: 18px; }
    model-viewer { width: 100%; height: 74vh; background: linear-gradient(#ffffff, #e9eef2); }
    #ar-button { background: #F28C28; color: #fff; border: none; border-radius: 30px; padding: 14px 26px;
                 font-size: 17px; font-weight: bold; position: absolute; bottom: 20px; left: 50%;
                 transform: translateX(-50%); box-shadow: 0 4px 12px rgba(0,0,0,.25); }
    .progress-bar { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,.08); }
    .progress-bar.hide { visibility: hidden; }
    .update-bar { height: 100%; width: 0%; background: #1D4286; transition: width .3s; }
    p { margin: 10px 16px; font-size: 14px; color: #4A4A4A; }
    .credito { font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <header>Comfamiliar Nariño · Valla en Realidad Aumentada</header>

  <!-- Valla de 130 x 188 cm, instalada con su borde inferior a 1,5 m del piso.
       Las 2 imágenes (Crédito Social y Requisitos) rotan cada 6 s: la animación viene dentro de valla-rotativa-v2.glb y valla-rotativa-v2.usdz.
       Sin camera-controls: siempre se ve de frente, quieta, como pegada a la pared. -->
  <model-viewer
    src="valla-rotativa-v2.glb"
    ios-src="valla-rotativa-v2.usdz"
    alt="Valla publicitaria de Comfamiliar Nariño con imágenes rotativas"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed"
    autoplay
    camera-target="0m 2.43m 0m"
    camera-orbit="0deg 90deg 4.4m"
    field-of-view="30deg"
    interaction-prompt="none"
    tone-mapping="neutral"
    environment-image="neutral"
    shadow-intensity="0.6">
    <div class="progress-bar hide" slot="progress-bar"><div class="update-bar"></div></div>
    <button slot="ar-button" id="ar-button">📱 Ver en tu espacio</button>
  </model-viewer>

  <p>Toca el botón naranja y apunta al piso junto a una pared: la valla aparece a 1,5 m de altura.</p>
  <p class="credito">Comfamiliar Nariño · Prototipo de valla virtual rotativa: Crédito Social. v2</p>

  <script>
    const visor = document.querySelector("model-viewer");
    visor.addEventListener("progress", (e) => {
      const barra = visor.querySelector(".progress-bar");
      barra.querySelector(".update-bar").style.width = `${e.detail.totalProgress * 100}%`;
      barra.classList.toggle("hide", e.detail.totalProgress === 1);
    });
  </script>
</body>
</html>
