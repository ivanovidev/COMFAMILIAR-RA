<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comfamiliar Nariño | Experiencia en Realidad Aumentada</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f5; text-align: center; }
    header { background: linear-gradient(90deg, #1D4286, #DF0689); color: #fff; padding: 14px; font-weight: bold; font-size: 18px; }
    model-viewer { width: 100%; height: 74vh; background: linear-gradient(#ffffff, #e9eef2); }
    #ar-button { background: #F28C28; color: #fff; border: none; border-radius: 30px; padding: 14px 26px;
                 font-size: 17px; font-weight: bold; position: absolute; bottom: 20px; left: 50%;
                 transform: translateX(-50%); box-shadow: 0 4px 12px rgba(0,0,0,.25); }
    .progress-bar { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,.08); }
    .progress-bar.hide { visibility: hidden; }
    .update-bar { height: 100%; width: 0%; background: #039047; transition: width .3s; }
    p { margin: 10px 16px; font-size: 14px; color: #4A4A4A; }
    #error-modelo { color: #C0392B; font-weight: bold; }
    .credito { font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <header>Comfamiliar Nariño · Experiencia en Realidad Aumentada</header>

  <!-- Secuencia: la foto del edificio (1,50 m de ancho) se despliega de abajo hacia arriba en 24 franjas (3 s) -> el edificio completo se ve 3 s -> rayo y destello: el edificio se desvanece y en su lugar aparece la valla (1,70 m de ancho x 2,62 m,
       borde inferior a 1,50 m). Toda la animación surge a 1,50 m del piso -> ciclo de imágenes: SV Portada 3 s, SV 1a/1b/1c 6 s, CS Portada 3 s, CS 1/2 6 s.
       El GLB trae 3 animaciones: "Intro" (una vez), "Ciclo" (en bucle) y "Completa" (para visores que repiten todo). -->
  <model-viewer
    id="visor"
    src="experiencia-v6.glb"
    ios-src="experiencia-v6.usdz"
    alt="Sede Comfamiliar Nariño que se despliega y valla con campañas de Subsidio de Vivienda y Crédito Social"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed"
    animation-name="Intro"
    animation-crossfade-duration="0"
    camera-target="0m 2.8m 0m"
    camera-orbit="0deg 85deg 8.5m"
    field-of-view="32deg"
    interaction-prompt="none"
    tone-mapping="neutral"
    environment-image="neutral"
    shadow-intensity="0.7">
    <div class="progress-bar hide" slot="progress-bar"><div class="update-bar"></div></div>
    <button slot="ar-button" id="ar-button">📱 Ver en tu espacio</button>
  </model-viewer>

  <p id="error-modelo"></p>
  <p>Toca el botón naranja y apunta al piso: a 1,50 m de altura la sede se despliega y, con un destello de luz, se transforma en la valla con las campañas.</p>
  <p class="credito">Comfamiliar Nariño · Prototipo de experiencia RA: Subsidio de Vivienda y Crédito Social. v6</p>

  <script>
    const visor = document.getElementById("visor");

    // 1) Intro una sola vez (edificio + luz + valla) y 2) luego el ciclo de imágenes en bucle
    function iniciar() {
      visor.animationName = "Intro";
      visor.currentTime = 0;
      visor.play({ repetitions: 1 });
    }
    visor.addEventListener("load", iniciar);
    visor.addEventListener("finished", () => {
      if (visor.animationName === "Intro") {
        visor.animationName = "Ciclo";
        visor.currentTime = 0;
        visor.play();                       // repeticiones infinitas
      }
    });
    // Al entrar en realidad aumentada (Android con WebXR), la secuencia arranca desde el principio
    visor.addEventListener("ar-status", (e) => { if (e.detail.status === "session-started") iniciar(); });

    // Si el modelo no carga, dice cuál archivo falta
    visor.addEventListener("error", () => {
      document.getElementById("error-modelo").textContent =
        "No se pudo cargar " + visor.getAttribute("src") + ". Revisa que ese archivo esté subido al repositorio con ese nombre exacto.";
    });

    visor.addEventListener("progress", (e) => {
      const barra = visor.querySelector(".progress-bar");
      barra.querySelector(".update-bar").style.width = `${e.detail.totalProgress * 100}%`;
      barra.classList.toggle("hide", e.detail.totalProgress === 1);
    });
  </script>
</body>
</html>
