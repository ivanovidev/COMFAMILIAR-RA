<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comfamiliar Nariño | Robot en Realidad Aumentada</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f5; text-align: center; }
    header { background: #1D4286; color: #fff; padding: 14px; font-weight: bold; font-size: 18px; }
    model-viewer { width: 100%; height: 72vh; background: linear-gradient(#ffffff, #e8f0f8); }

    /* Botón de realidad aumentada */
    #ar-button { background: #F28C28; color: #fff; border: none; border-radius: 30px; padding: 14px 26px;
                 font-size: 17px; font-weight: bold; position: absolute; bottom: 20px; left: 50%;
                 transform: translateX(-50%); box-shadow: 0 4px 12px rgba(0,0,0,.25); }

    /* Barra de carga */
    .progress-bar { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,.08); }
    .progress-bar.hide { visibility: hidden; transition: visibility .3s; }
    .update-bar { height: 100%; width: 0%; background: #039047; transition: width .3s; }

    /* Mano animada que indica mover el celular en modo RA */
    #ar-prompt { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); display: none; }
    model-viewer[ar-status="session-started"] #ar-prompt { display: block; }
    #ar-prompt > img { animation: mover 4s ease-in-out infinite; width: 80px; }
    @keyframes mover { 0%,100% { transform: translateX(-40px); } 50% { transform: translateX(40px); } }

    /* Botón de música */
    .barra-musica { padding: 10px; background: #fff; border-bottom: 1px solid #e3e3e3; }
    #btn-musica { background: #1D4286; color: #fff; border: none; border-radius: 24px; padding: 12px 22px;
                  font-size: 16px; font-weight: bold; box-shadow: 0 3px 10px rgba(0,0,0,.2); cursor: pointer; }
    #estado-musica { display: block; font-size: 12px; color: #C0392B; margin-top: 6px; min-height: 14px; }
    #btn-musica.sonando { background: #039047; }

    p { margin: 10px 16px; font-size: 14px; color: #4A4A4A; }
    .credito { font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <header>Comfamiliar Nariño · Robot en Realidad Aumentada</header>
  <div class="barra-musica">
    <button id="btn-musica" type="button">🎵 Tocar música</button>
    <span id="estado-musica"></span>
  </div>

  <!-- Robot v3: 30 cm, camisa blanca, piernas grises y logo en el pecho. robot-v3.glb (web y Android) y robot-v3.usdz (iPhone) -->
  <model-viewer
    src="robot-v3.glb"
    ios-src="robot-v3.usdz"
    ar-scale="fixed"
    alt="Robot BrainStem bailando"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    tone-mapping="neutral"
    environment-image="neutral"
    shadow-intensity="1"
    autoplay
    touch-action="pan-y">
    <div class="progress-bar hide" slot="progress-bar"><div class="update-bar"></div></div>
    <button slot="ar-button" id="ar-button">📱 Ver en tu espacio</button>
    <div id="ar-prompt"><img src="https://modelviewer.dev/shared-assets/icons/hand.png" alt="Mueve el celular"></div>
  </model-viewer>

  <!-- Música: reemplaza musica.mp3 por otra canción libre de derechos con el mismo nombre -->
  <audio id="musica" src="musica.mp3" loop preload="auto" playsinline></audio>

  <p>Sube el volumen, toca 🎵 y luego el botón naranja para ver al robot bailar en tu entorno.</p>
  <p class="credito">Modelo de demostración interna: BrainStem (© 2017 Smith Micro Software), muestras glTF de Khronos Group. Música: ritmo original libre de derechos. v5</p>

  <script>
    // Música: los navegadores exigen un toque del usuario para reproducir sonido
    const musica = document.getElementById("musica");
    const btn = document.getElementById("btn-musica");
    const estado = document.getElementById("estado-musica");
    function sonar(encender) {
      if (!encender) { musica.pause(); return; }
      estado.textContent = "";
      musica.play().catch((err) => {
        estado.textContent = "No se pudo reproducir: " + (err && err.name === "NotAllowedError"
          ? "el navegador bloqueó el sonido. Toca el botón otra vez."
          : "revisa que musica.mp3 esté subido al repositorio.");
      });
    }
    musica.addEventListener("playing", () => { btn.textContent = "🔊 Pausar música"; btn.classList.add("sonando"); });
    musica.addEventListener("pause",   () => { btn.textContent = "🎵 Tocar música"; btn.classList.remove("sonando"); });
    musica.addEventListener("error",   () => { estado.textContent = "No se encontró musica.mp3 en el repositorio."; });
    btn.addEventListener("click", () => sonar(musica.paused));
    // Al entrar en realidad aumentada, la música arranca sola (el toque en el botón naranja cuenta como permiso)
    document.getElementById("ar-button").addEventListener("click", () => sonar(true));

    // Mueve la barra de carga mientras descarga el modelo
    const visor = document.querySelector("model-viewer");
    visor.addEventListener("progress", (e) => {
      const barra = visor.querySelector(".progress-bar");
      barra.querySelector(".update-bar").style.width = `${e.detail.totalProgress * 100}%`;
      barra.classList.toggle("hide", e.detail.totalProgress === 1);
    });
  </script>
</body>
</html>
