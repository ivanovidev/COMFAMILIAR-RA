<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comfamiliar Nariño | Realidad Aumentada</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f5; color: #0B4F8A; text-align: center; }
    header { background: #00843D; color: #fff; padding: 14px; font-weight: bold; font-size: 18px; }
    model-viewer { width: 100%; height: 72vh; background: linear-gradient(#ffffff, #e8f0f8); }
    .boton-ra { background: #F28C28; color: #fff; border: none; border-radius: 30px;
                padding: 14px 26px; font-size: 17px; font-weight: bold; position: absolute;
                bottom: 20px; left: 50%; transform: translateX(-50%); box-shadow: 0 4px 12px rgba(0,0,0,.25); }
    p { margin: 10px 16px; font-size: 14px; color: #4A4A4A; }
  </style>
</head>
<body>
  <header>Comfamiliar Nariño · Realidad Aumentada</header>

  <!-- Versión 5: logo de dos caras 30 x 30 cm con giro completo. Cada versión nueva lleva otro nombre para evitar la caché -->
  <model-viewer
    src="logo-v5.glb"
    ios-src="logo-v5.usdz"
    autoplay
    alt="Logo 3D de Comfamiliar Nariño"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    camera-controls
    environment-image="neutral"
    tone-mapping="neutral"
    exposure="1.0"
    shadow-intensity="1.3"
    shadow-softness="0.7"
    camera-orbit="0deg 80deg auto"
    touch-action="pan-y">
    <button slot="ar-button" class="boton-ra">📱 Ver en tu espacio</button>
  </model-viewer>

  <p>Gira el logo con el dedo para ver el reverso. Toca el botón naranja y apunta a una mesa para verlo en tu entorno.</p>
  <p style="font-size:11px;color:#999">v5</p>
</body>
</html>
